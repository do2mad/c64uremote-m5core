; ------------------------------------------------------------------
; C64uRemote fuer M5Stack Core (Basic / Gray) + Unit RFID2 (WS1850S)
;
;   Build:    pio run
;   Flashen:  pio run -t upload
;   Monitor:  pio device monitor
;
; Fuer M5Stack Fire einfach das zweite Environment benutzen:
;   pio run -e m5stack-fire -t upload
; ------------------------------------------------------------------

[platformio]
default_envs = m5stack-core-esp32

[env]
platform  = espressif32@^6.9.0
framework = arduino

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder
; 921600 schafft der USB-Serial-Chip des Core auf macOS oft nicht stabil
; ("Unable to verify flash chip connection"). 460800 laeuft zuverlaessig,
; im Zweifel auf 115200 gehen.
upload_speed   = 460800

; Grosses App-Image, kein OTA -> genug Platz fuer WiFi + SD + RFID
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_ldf_mode = deep+
lib_deps =
    m5stack/M5Unified @ ^0.2.8
    m5stack/M5GFX @ ^0.2.11
    bblanchon/ArduinoJson @ ^6.21.5
    https://github.com/kkloesener/MFRC522_I2C.git

[env:m5stack-core-esp32]
board = m5stack-core-esp32

[env:m5stack-fire]
board = m5stack-fire
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
